
domain: t3code.example.com

# Required: the published workspace image. CI publishes one per release.
image: ghcr.io/dislace/vswarm-workspace:v0.1.0

db_image: postgres:18.4

resources:
  cpus: "2.0"
  memory: 6g
  pids: 4096

token_ttl: 30d

# The Cloudflare Access application in front of the proxy. With both set, the
# proxy verifies the Access JWT and routes on its signed email claim; without
# them it trusts the identity header Access sets. See THREAT-MODEL.md.
# access_team_domain: yourteam.cloudflareaccess.com
# access_aud: 0123456789abcdef...

# Host paths published read-only into every workspace. Host-managed assets
# belong here rather than in the image: rebaking one moves the image id, and a
# moved image id recreates every workspace, killing the sessions inside.
# mounts:
#   - /opt/vswarm/cli:/opt/vendor-cli

tenants:
  - email: sarah@example.com
    name: sarah
    services: [postgres]
    admin: true
    repos: [Acme/api, Acme/web]
  - email: alex@example.com
    name: alex
    services: [playwright]
