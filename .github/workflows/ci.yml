name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: image/Dockerfile
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck --version
          shellcheck image/bake-t3-runtime.sh image/entrypoint.sh image/prompt.sh image/vswarm-repos image/vswarm-t3 image/vswarm-dev scripts/*.sh

  workspace-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build workspace image
        uses: docker/build-push-action@v7
        with:
          context: image
          load: true
          tags: vswarm/workspace:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min
      # Asserting on the seeded files alone is what let a t3 repackaging reach a
      # tenant: the runtime looked complete while the launcher the entrypoint
      # runs had stopped existing. So start the image the way a tenant does and
      # require its own healthcheck -- t3 answering on 3773 -- to pass.
      - name: Verify the workspace serves
        run: |
          docker run -d --name ci-workspace vswarm/workspace:ci
          for _ in $(seq 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' ci-workspace)"
            case "${status}" in healthy | unhealthy) break ;; esac
            sleep 5
          done
          docker logs ci-workspace
          docker exec ci-workspace vswarm-t3 status
          test "${status}" = healthy
      # The libraries this checks are the ones t3's own browser loads too,
      # and nothing else in the image would notice them missing.
      - name: The baked headless shell launches
        run: |
          docker exec ci-workspace sh -c '
            exec "$(find /opt/ms-playwright -type f -name headless_shell | head -n 1)" \
              --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom about:blank'
      - name: Stop the workspace
        if: always()
        run: docker rm -f ci-workspace || true
