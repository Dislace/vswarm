name: release

# A deployment installs a pinned vswarm the way it installs k3s or cloudflared:
# a version, a URL, and a checksum it verifies before trusting the file. That
# only works if a tag produces exactly one downloadable binary and one image.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/vswarm-linux-${arch}" ./cmd/vswarm
          done
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum vswarm-linux-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes dist/*

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: binary
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: image
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vswarm-workspace:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
      # The tag is what a host reads; the digest is what it can pin. Shipping
      # it as a release asset means the same release names both.
      - name: Publish the image digest
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          printf 'ghcr.io/%s/vswarm-workspace:%s\nghcr.io/%s/vswarm-workspace@%s\n' \
            "${OWNER}" "${GITHUB_REF_NAME}" "${OWNER}" "${DIGEST}" > workspace-image.txt
          gh release upload "${GITHUB_REF_NAME}" workspace-image.txt
